[package]
name = "bracel-data"
version = "0.4.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
description = "Transactional API mutation and access helpers for Bracel"
repository = "https://github.com/4H1R/bracel"

[dependencies]
bracel = { version = "0.4.0", path = "../bracel" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tracing = "0.1"
uuid = { version = "1", features = ["v7", "serde"] }

[lints.rust]
unsafe_code = "forbid"
