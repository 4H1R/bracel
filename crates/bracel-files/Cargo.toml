[package]
name = "bracel-files"
version = "0.4.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
description = "Authorized upload and attachment lifecycle for Bracel APIs"
repository = "https://github.com/4H1R/bracel"

[dependencies]
bracel = { version = "0.4.0", path = "../bracel" }
bracel-integrations = { version = "0.4.0", path = "../bracel-integrations", features = ["storage"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v7", "serde"] }

[lints.rust]
unsafe_code = "forbid"
