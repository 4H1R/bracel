[package]
name = "bracel-realtime"
version = "0.3.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
description = "Transactional event history and bounded API streams for Bracel"
repository = "https://github.com/4H1R/bracel"

[features]
default = []
websocket = ["bracel/axum-ws"]

[dependencies]
bracel = { version = "0.3.0", path = "../bracel" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v7", "serde"] }
tokio = { version = "1", features = ["sync", "time"] }
futures-util = "0.3"

[lints.rust]
unsafe_code = "forbid"
