[package]
name = "bracel-cli"
version = "0.3.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
description = "Create an application from the Bracel starter"
repository = "https://github.com/4H1R/bracel"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
toml_edit = "0.25"
sha2 = "0.10"
rmcp = { version = "=3.4.1", features = ["server", "transport-io", "schemars"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std"] }

[[bin]]
name = "bracel"
path = "src/main.rs"

[lints.rust]
unsafe_code = "forbid"
