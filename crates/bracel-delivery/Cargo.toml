[package]
name = "bracel-delivery"
version = "0.3.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
description = "Durable API notifications and signed webhook delivery for Bracel"
repository = "https://github.com/4H1R/bracel"

[dependencies]
bracel = { version = "0.3.0", path = "../bracel", features = ["jobs"] }
bracel-data = { version = "0.3.0", path = "../bracel-data" }
bracel-realtime = { version = "0.3.0", path = "../bracel-realtime" }
bracel-integrations = { version = "0.3.0", path = "../bracel-integrations", features = ["mail", "http"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hmac = "0.12"
sha2 = "0.10"
uuid = { version = "1", features = ["v7", "serde"] }

[lints.rust]
unsafe_code = "forbid"
