[package]
name = "bracel-jobs"
version = "0.3.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
description = "Durable PostgreSQL jobs and schedules for API applications"
repository = "https://github.com/4H1R/bracel"

[dependencies]
sea-orm = { version = "2.0.3", default-features = false, features = ["sqlx-postgres", "runtime-tokio-rustls", "with-uuid", "with-chrono"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "macros", "rt"] }
uuid = { version = "1", features = ["v7", "serde"] }
chrono = "0.4"
chrono-tz = "0.10"
cron = "0.17"
tracing = "0.1"

[lints.rust]
unsafe_code = "forbid"
