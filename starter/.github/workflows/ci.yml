name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_USER: starter
          POSTGRES_PASSWORD: starter
          POSTGRES_DB: starter_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U starter -d starter_test" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://starter:starter@localhost:5432/starter_test
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain
      - name: Restore Cargo sources and build outputs
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
            target/release
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-v1-${{ hashFiles('rust-toolchain.toml', '**/Cargo.toml', 'Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-v1-${{ hashFiles('rust-toolchain.toml', '**/Cargo.toml', 'Cargo.lock') }}-
      - name: Restore cargo-deny
        id: cargo-deny-cache
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/cargo-deny
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-deny-0.20.2-${{ hashFiles('rust-toolchain.toml') }}
      - run: cargo install cargo-deny --version 0.20.2 --locked
        if: steps.cargo-deny-cache.outputs.cache-hit != 'true'
      - run: bash scripts/check.sh
  container:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/container-smoke.sh
