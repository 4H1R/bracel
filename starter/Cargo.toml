[package]
name = "bracel-starter"
version = "0.3.0"
edition = "2024"
rust-version = "1.98"
publish = false
license = "MIT"
default-run = "bracel-starter"

[dependencies]
argon2 = "0.5.3"
getrandom = "0.4"
sha2 = "0.10"
bracel-files = { version = "0.3.0", path = "../crates/bracel-files", optional = true }
bracel-delivery = { version = "0.3.0", path = "../crates/bracel-delivery", optional = true }
bracel-realtime = { version = "0.3.0", path = "../crates/bracel-realtime", optional = true, features = ["websocket"] }
bracel-data = { version = "0.3.0", path = "../crates/bracel-data", optional = true }
bracel-integrations = { version = "0.3.0", path = "../crates/bracel-integrations", optional = true, default-features = false }
bracel = { version = "0.3.0", path = "../crates/bracel", features = ["jobs", "tokens"] }
axum = { version = "0.8.9", features = ["json"] }
sea-orm = { version = "2.0.3", default-features = false, features = ["sqlx-postgres", "runtime-tokio-rustls", "macros", "with-uuid", "with-chrono"] }
sea-orm-migration = { version = "2.0.3", default-features = false, features = ["sqlx-postgres", "runtime-tokio-rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "net", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json"] }
utoipa = { version = "6", features = ["uuid"] }
uuid = { version = "1", features = ["v7", "serde"] }
url = "2"

[dev-dependencies]
bracel = { version = "0.3.0", path = "../crates/bracel", features = ["testing"] }
base64 = "0.22"
jsonwebtoken = { version = "11.1", features = ["aws_lc_rs"] }
tower = { version = "0.5", features = ["util"] }

[build-dependencies]
sha2 = "0.10"
serde_json = "1"
toml = "1.1"

[lints.rust]
unsafe_code = "forbid"

[features]
default = ["mail", "cache"]
batteries = ["dep:bracel-data", "dep:bracel-realtime", "dep:bracel-delivery", "dep:bracel-files", "storage", "compression"]
compression = ["bracel/compression"]
identity = ["dep:bracel-integrations", "bracel-integrations/identity"]
mail = ["dep:bracel-integrations", "bracel-integrations/mail"]
storage = ["dep:bracel-integrations", "bracel-integrations/storage"]
cache = ["dep:bracel-integrations", "bracel-integrations/cache"]
outbound = ["dep:bracel-integrations", "bracel-integrations/http"]
telemetry = ["dep:bracel-integrations", "bracel-integrations/telemetry"]
