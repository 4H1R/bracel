[package]
name = "bracel-starter"
version = "0.1.1"
edition = "2024"
rust-version = "1.98"
publish = false
license = "MIT"
default-run = "bracel-starter"

[dependencies]
bracel = { version = "0.1.1", path = "../crates/bracel" }
axum = { version = "0.8.9", features = ["json"] }
sea-orm = { version = "2.0.3", default-features = false, features = ["sqlx-postgres", "runtime-tokio-rustls", "macros", "with-uuid", "with-chrono"] }
sea-orm-migration = { version = "2.0.3", default-features = false, features = ["sqlx-postgres", "runtime-tokio-rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "net", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json"] }
utoipa = { version = "6", features = ["uuid"] }
uuid = { version = "1", features = ["v7", "serde"] }
url = "2"

[dev-dependencies]
base64 = "0.22"
jsonwebtoken = { version = "11.1", features = ["aws_lc_rs"] }
tower = { version = "0.5", features = ["util"] }

[lints.rust]
unsafe_code = "forbid"
